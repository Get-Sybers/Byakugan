[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is byakugan (formerly piiat-mitrecar); the import package
# keeps the historical name piiat_mitrecar — every consumer drives it as
# `python -m piiat_mitrecar`, and the STIX namespace seeds derive from it.
name = "byakugan"
version = "0.1.0"
description = "Byakugan (formerly PIIAT-MitreCar) — normalise raw DFIR processor output (EvtxECmd, log2timeline, Zeek, PIIAT-Mem) into finished MITRE CAR: per-source databases, an inference cascade, per-object JSON."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["dfir", "mitre-car", "mitre-attack", "forensics", "timeline",
            "car", "normalisation", "incident-response"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "yamale>=4", "yamllint>=1.30"]

[project.urls]
Repository = "https://github.com/Get-Sybers/byakugan"
Issues = "https://github.com/Get-Sybers/byakugan/issues"

[project.scripts]
byakugan = "piiat_mitrecar.pipeline:main"

[tool.setuptools]
packages = ["piiat_mitrecar", "piiat_mitrecar.mappings", "piiat_mitrecar.adapters"]

[tool.setuptools.package-data]
# the CAR/superset models + ATT&CK relationships are reconstructed live from the
# pinned submodules, so they are not shipped; only the owned data files are.
piiat_mitrecar = ["cascade_relationships.yml", "relationships.yml", "spindle.yml",
                  "car_source_schema.yaml"]
