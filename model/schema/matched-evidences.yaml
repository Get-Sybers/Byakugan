# Matched evidences matrix — 99 source rows individually matched by mechanism
# into canonical rows. sources = [repo#row] from the per-source extracts
# (docs/research/dfir-context/); tier disagreements reconciled CONSERVATIVELY
# (weaker tier wins, disagreement noted). Matching judgments at the end.
# row ids refer to the consolidated validated-rows.json index (0-98).

evtx:
  # --- authentication ---
  - object: authentication
    action: success
    evidence: definitive
    time: event-time
    when: Security 4624
    basis: >-
      Security 4624 "An account was successfully logged on" — subject/target
      SID+name, LogonType, AuthenticationPackage, workstation/IP.
    sources: [dfir-toolkit#3, evtx-etw-resources#20, mitre-alerts#90]
  - object: authentication
    action: success
    evidence: heuristic
    time: event-time
    when: Security 4648
    basis: >-
      Security 4648 "A logon was attempted using explicit credentials" —
      records the ATTEMPT, not the outcome.
    sources: [evtx-etw-resources#22, dfir-toolkit#3]
    note: dfir-toolkit folded 4648 into its 4624 row as definitive; split and
      typed heuristic per the more careful evtx-etw reading.
  - object: authentication
    action: failure
    evidence: definitive
    time: event-time
    when: Security 4625
    basis: Security 4625 "An account failed to log on" — Status/SubStatus/FailureReason.
    sources: [dfir-toolkit#4, evtx-etw-resources#21, m365d-queries#78, mitre-alerts#91, labwork-findings#63]
    note: labwork's 4625→user_session.login row reclassified here — a failed
      logon opens no session; its lockout-observation context kept in provenance.
  - object: authentication
    action: success
    evidence: definitive
    time: event-time
    when: Security 4768 (Kerberos TGT)
    basis: Kerberos TGT issuance — PreAuthType, CertIssuer fields.
    sources: [labwork-findings#64]
  - object: authentication
    action: success
    evidence: heuristic
    time: event-time
    when: Security 4769 (Kerberos TGS)
    basis: TGS requests are high-volume/low-signal; Transited-Services adds context.
    sources: [labwork-findings#65]
  - object: authentication
    action: success
    evidence: definitive
    time: event-time
    when: Security 4776 (NTLM)
    basis: NTLM credential validation — account, protocol, error code.
    sources: [labwork-findings#66]
  # --- user_session ---
  - object: user_session
    action: login
    evidence: definitive
    time: event-time
    when: Security 4624, interactive-class LogonType (2/7/10/11)
    basis: >-
      The session-establishing read of 4624 — LogonType scopes it to
      interactive/unlock/remote-interactive classes.
    sources: [dfir-toolkit#0, evtx-etw-resources#23, labwork-findings#62, m365d-queries#77, mitre-alerts#89]
  - object: user_session
    action: login
    evidence: definitive
    time: event-time
    when: System 7001 (Winlogon)
    basis: Winlogon logon notification (7002 the logoff counterpart).
    sources: [evtx-etw-resources#35]
  - object: user_session
    action: login
    evidence: definitive
    time: event-time
    when: TerminalServices-LocalSessionManager 21 (RDP)
    basis: Session logon succeeded — RDP source address in fields.
    sources: [evtx-etw-resources#36, dfir-toolkit#0]
  - object: user_session
    action: logout
    evidence: definitive
    time: event-time
    when: Security 4634 / 4647
    basis: Logoff / user-initiated logoff.
    sources: [dfir-toolkit#1, evtx-etw-resources#24]
  - object: user_session
    action: reconnect
    evidence: definitive
    time: event-time
    when: Security 4778 (4779 = disconnect)
    basis: Session reconnected to a Window Station.
    sources: [dfir-toolkit#2, evtx-etw-resources#25]
  - object: user_session
    action: reconnect
    evidence: definitive
    time: event-time
    when: TerminalServices-LocalSessionManager 25
    basis: RDP session reconnection succeeded.
    sources: [evtx-etw-resources#37, dfir-toolkit#2]
  - object: user_session
    action: metadata
    evidence: definitive
    time: event-time
    when: Security 4672
    basis: Special privileges assigned to new logon — types the session.
    sources: [evtx-etw-resources#26]
  # --- process ---
  - object: process
    action: create
    evidence: definitive
    time: event-time
    when: Sysmon 1
    basis: Image, command line, hashes, parent, ProcessGuid.
    sources: [evtx-etw-resources#39, labwork-findings#55, mitre-alerts#83]
  - object: process
    action: create
    evidence: definitive
    time: event-time
    when: Security 4688
    basis: >-
      NewProcessId/NewProcessName (+ command line when audited). m365d's
      net.exe account-creation pattern rides this row; its 4720 half is the
      account-object vocabulary gap.
    sources: [dfir-toolkit#5, evtx-etw-resources#27, mitre-alerts#84, m365d-queries#79]
  - object: process
    action: terminate
    evidence: definitive
    time: event-time
    when: Security 4689
    basis: Process exited — closes the 4688 lifetime.
    sources: [evtx-etw-resources#28]
  - object: process
    action: terminate
    evidence: definitive
    time: event-time
    when: Sysmon 5
    basis: Process terminated.
    sources: [evtx-etw-resources#42]
  - object: process
    action: execute
    evidence: heuristic
    time: event-time
    when: PowerShell 4103/4104
    basis: >-
      Module/pipeline logging and script-block capture at execution start;
      captures code delivered for execution, not its completion.
    sources: [dfir-toolkit#7, labwork-findings#56, mitre-alerts#92, mitre-alerts#93]
    note: dfir-toolkit and mitre-alerts typed definitive; labwork's heuristic
      reading kept (conservative).
  - object: process
    action: execute
    evidence: definitive
    time: event-time
    when: AppLocker EXE-and-DLL channel, allow decisions (8002)
    basis: >-
      AppLocker execution ALLOW decisions only — a blocked execution
      (8003/8004) did not execute (constraints: applocker-allow-only).
    sources: [dfir-toolkit#6]
  - object: process
    action: access
    evidence: definitive
    time: event-time
    when: Sysmon 10
    basis: Granted access mask, call trace, source/target (lsass credential-theft shape).
    sources: [evtx-etw-resources#46, labwork-findings#53]
  - object: process
