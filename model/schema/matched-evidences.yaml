    time: event-time
    when: Security 4663 (PROCESS_VM_READ)
    basis: Kernel-object audit read access on a process (requires SACL).
    sources: [labwork-findings#54]
  - object: process
    action: modify
    evidence: definitive
    time: event-time
    when: Sysmon 25
    basis: Process tampering (image change / hollowing indicator).
    sources: [evtx-etw-resources#52]
    note: legal CAR pair with NO current lane — declared-but-unreached capability.
  # --- service ---
