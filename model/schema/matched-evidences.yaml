constraints:
  # RFC-2119 normative layer over the matched rows above.
  # Row refs: "<family>:<when>" cites a row of this file; extract refs are
  # "<repo>#<row>" or "extract-<repo>.md:<line>". Tier numbers are the wire
  # projection (model/stix/conventions.yml:207): definitive=100, heuristic=50,
  # inferred=20. MUST = guaranteed by the artefact's nature under default
  # configuration; MAY = gated by non-default policy, installed software,
  # SACLs, or machine role — a conforming producer parses them when present
  # but their ABSENCE carries no meaning (rule absence-not-evidence).
  rules:
    # ------------------------------------------------ 1. MUST yields (backbone)
    - id: evtx-auth-backbone
      level: MUST
      scope: {family: evtx, object: authentication}
      statement: >-
        Parsing Security.evtx MUST yield authentication.success from 4624 and
        authentication.failure from 4625 when those records are present
        (Logon auditing is default-on); both definitive/event-time.
      grounds: ["evtx:Security 4624", "evtx:Security 4625"]
      enforcement: review    # Parser Profile conformance fixture (golden 4624/4625)
    - id: evtx-session-backbone
      level: MUST
      scope: {family: evtx, object: user_session}
      statement: >-
        Parsing MUST yield user_session.login from 4624 interactive-class
        LogonTypes (2/7/10/11), logout from 4634/4647, reconnect from 4778 and
        TerminalServices-LocalSessionManager 21/25 — all default-on channels.
      grounds: ["evtx:Security 4624, interactive-class LogonType (2/7/10/11)",
                "evtx:Security 4634 / 4647", "evtx:Security 4778 (4779 = disconnect)",
                "evtx:TerminalServices-LocalSessionManager 21 (RDP)",
                "evtx:TerminalServices-LocalSessionManager 25"]
      enforcement: review
    - id: evtx-service-backbone
      level: MUST
      scope: {family: evtx, object: service}
      statement: >-
        Parsing System.evtx MUST yield service.create from 7045 and
        service.stop from 7034/7036 (SCM provider, default-on), including the
        qualified-id form 1073748869 for 7045.
      grounds: ["evtx:System 7045", "evtx:System 7034/7036"]
      enforcement: review
    - id: evtx-logclear-backbone
      level: MUST
      scope: {family: evtx, object: file, action: modify, when: Security 1102}
      statement: >-
        1102 cannot be disabled by policy; when present it MUST be yielded
        (definitive, event-time) — it is the self-report that survives the wipe.
      grounds: ["evtx:Security 1102"]
      enforcement: review
    - id: mft-usn-filestat-backbone
      level: MUST
      scope: {family: [usnjrnl, filestat]}
      statement: >-
        usnjrnl parsing MUST be able to yield file create, modify AND delete
        (USN reason flags are direct action records; delete is in the artefact's
        nature even though no matched row covers it — overlay rule applies);
        filestat MUST yield file.metadata from MACB columns.
      grounds: ["usnjrnl:USN reason flags, multi-drop burst shape",
                "usnjrnl:USN modify records (accessibility-binary overwrite shape)",
                "filestat:MACB columns"]
      enforcement: review
    - id: wtmp-backbone
      level: MUST
      scope: {family: wtmp}
      statement: >-
        wtmp parsing MUST yield user_session.login (and logout — the record
        pair is in the artefact; overlay rule applies) and btmp
        authentication.failure; all definitive/event-time.
      grounds: ["wtmp:wtmp records", "wtmp:btmp records", "dfir-toolkit#13", "dfir-toolkit#14"]
      enforcement: review
    - id: persistence-state-backbone
      level: MUST
      scope: {family: [run-keys, registry-hives, scheduled-tasks]}
      statement: >-
        When the values/files are present, parsing MUST yield the STATE rows:
        registry.value_edit for Run*/IFEO/WDigest/Defender-exclusion values
        (definitive, bounded by key last-write where hive timestamps exist),
        service.metadata from SYSTEM-hive enumeration (definitive, none), file
        create for task XML and registry.add for TaskCache (definitive, bounded).
      grounds: ["run-keys:Run/RunOnce(Ex)/RunServices values", "run-keys:IFEO Debugger value",
                "registry-hives:SYSTEM hive services enumeration",
                "registry-hives:WDigest UseLogonCredential",
                "scheduled-tasks:task XML under System32\\Tasks",
                "scheduled-tasks:TaskCache Tree/Tasks GUID entries"]
      enforcement: review
    - id: residue-exec-backbone
      level: MUST
      scope: {family: [shimcache, prefetch, shell-history, lnk-jumplists]}
      statement: >-
        When the artefact is present, parsing MUST yield its execution/access
        rows at DECLARED tier and time — shimcache (process.execute, heuristic,
        bounded); prefetch (process execution rows, event-time run instants);
        shell-history (process.execute, heuristic, none); lnk-jumplists
        (file.access, heuristic, event-time).
      grounds: ["shimcache:AppCompatCache entry",
                "prefetch:schtasks.exe / recycler-path binaries in prefetch",
                "shell-history:.bash_history lines",
                "lnk-jumplists:Automatic/CustomDestinations + Recent .lnk"]
      enforcement: review
    - id: evtx-account-backbone
      level: MUST
      scope: {family: evtx, object: [user_account, group]}
      statement: >-
        Parsing Security.evtx MUST yield user_account.create from 4720,
        user_account.delete from 4726, user_account.modify from the
        modification cluster (4722/4723/4724/4725/4738/4740/4767/4781), and
        the group create/delete/modify rows (4727/4731, 4730/4734,
        4728/4732/4756 + removals) when those records are present — User
        Account Management and Security Group Management success auditing are
        default-on; all definitive/event-time.
      grounds: ["evtx:Security 4720", "evtx:Security 4726",
                "evtx:Security 4722/4723/4724/4725/4738/4740/4767/4781",
                "evtx:Security 4727/4731", "evtx:Security 4730/4734",
                "evtx:Security 4728/4732/4756 (+ removals 4729/4733/4757)"]
      enforcement: review
    - id: taskscheduler-operational-backbone
      level: MUST
      scope: {family: evtx, object: scheduled_job, when: TaskScheduler-Operational}
      statement: >-
        Parsing the Microsoft-Windows-TaskScheduler/Operational channel MUST
        yield scheduled_job.create from 106, modify from 140 and delete from
        141 when those records are present (default-on channel); all
        definitive/event-time. The Security-channel counterparts (4698-4702)
        stay MAY — see gated-records-may.
      grounds: ["evtx:TaskScheduler-Operational 106",
                "evtx:TaskScheduler-Operational 140",
                "evtx:TaskScheduler-Operational 141"]
      enforcement: review

    # ------------------------------------------------ 2. MAY (config/role-gated)
    - id: gated-records-may
      level: MAY
      scope: {family: evtx}
      statement: >-
        The following are yielded only when the gating configuration exists,
        and are therefore MAY: all Sysmon rows (install + rule set — Sysmon
        1/2/3/5/6/7/8/10/11/12/13/14/23/25/26); 4688/4689 (Process Tracking
        audit, off by default; CommandLine further gated — the row's own
        "when audited"); 4697 (its basis says audit-policy gated); 4663 and
        4907 (SACL-dependent); 5140/5145 (File Share / Detailed File Share
        auditing, off by default); PowerShell 4103/4104 (module/script-block
        policy); AppLocker channel (policy deployed); 4768/4769/4776
        (authority-role-dependent: DC for Kerberos, authenticating authority
        for NTLM); 4698/4699/4700/4701/4702 (scheduled_job Security-channel
        counterparts — Other Object Access auditing, off by default; the
        default-on TaskScheduler-Operational channel is the MUST — see
        taskscheduler-operational-backbone).
      grounds: ["evtx:Security 4688", "evtx:Security 4697", "evtx:Security 4663 (PROCESS_VM_READ)",
                "evtx:Security 4907", "evtx:Security 5140", "evtx:Security 5145",
                "evtx:Security 4698 (scheduled_job — Other Object Access auditing)",
                "evtx:PowerShell 4103/4104", "evtx:AppLocker EXE-and-DLL channel, allow decisions (8002)",
                "evtx:Sysmon 1", "evtx:Security 4768 (Kerberos TGT)"]
      enforcement: review
    - id: absence-not-evidence
      level: MUST NOT
      scope: {family: all}
      statement: >-
        Absence of a MAY-class (config/role-gated) record MUST NOT be read as
        absence of the activity; the producer marks the guaranteed field with
        the absence vocabulary (not-applicable | unsupported | unknown), never
        as a negative finding.
      grounds: ["gated-records-may", "docs/design/schema-layers.md:62-68"]
      enforcement: review
    - id: shell-history-time-upgrade
      level: MAY
      scope: {family: shell-history, when: HISTTIMEFORMAT stamps present}
      statement: >-
        time MAY upgrade none -> event-time only when per-line stamps are
        present in the record (data-driven), never by assumption.
      grounds: ["shell-history:.bash_history lines"]
      enforcement: count-and-carry:evidence-time

    # ------------------------------------------------ 3. MUST NOT — tier upgrades
    - id: bounded-never-event-time
      level: MUST NOT
      scope: {family: [shimcache, run-keys, registry-hives, scheduled-tasks], time: bounded|none}
      statement: >-
        Hive-write-bounded and snapshot artefacts MUST NOT claim event-time:
        shimcache at-or-before the SYSTEM hive write; Run*/IFEO/WDigest/
        exclusion values bounded by key last-write; RetrievIR live snapshots
        carry NO timestamps and MUST NOT even claim bounded (collection limit).
      grounds: ["shimcache:AppCompatCache entry", "run-keys:Run/RunOnce(Ex)/RunServices values",
                "registry-hives:Terminal Server Client UsernameHint", "retrievir#98"]
      enforcement: schema + count-and-carry:evidence-time
    - id: residue-never-definitive-exec
      level: MUST NOT
      scope: {object: process, action: [execute, create]}
      statement: >-
        Presence/residue artefacts MUST NOT claim definitive for the execution
        they imply: shimcache presence is heuristic-bounded; a Run* value
        naming an executable is inferred-none for process.create (configured
        persistence is definitive only for the registry.value_edit row).
      grounds: ["shimcache:AppCompatCache entry", "run-keys:Run* value names an executable"]
      enforcement: schema + count-and-carry:evidence-tier
    - id: attempt-not-outcome
      level: MUST NOT
      scope: {family: evtx, object: authentication}
      statement: >-
        4648 records the ATTEMPT with explicit credentials and MUST NOT be
        read as a completed logon (max tier heuristic; never user_session.login);
        4769 TGS volume MUST NOT be read as definitive authentication (high-
        volume/low-signal — heuristic ceiling).
      grounds: ["evtx:Security 4648", "evtx:Security 4769 (Kerberos TGS)"]
      enforcement: schema + count-and-carry:evidence-tier
    - id: powershell-capture-not-completion
      level: MUST NOT
      scope: {family: evtx, when: PowerShell 4103/4104}
      statement: >-
        Script-block/module capture MUST NOT be upgraded past heuristic for
        process.execute — it records code delivered for execution, not its
        completion (the matrix's conservative reconciliation of the
        definitive-typed sources is normative).
      grounds: ["evtx:PowerShell 4103/4104"]
      enforcement: schema
    - id: single-stamp-ceiling
      level: MUST NOT
      scope: {family: [filestat, scheduled-tasks], when: mtime/atime columns}
      statement: >-
        A single overwritable POSIX/NTFS stamp MUST NOT ground more than one
        action instance (the LAST modify/access only; earlier edits invisible)
        and MUST NOT carry a tier above the filestat rows' typing; atime rows
        additionally degraded by NtfsDisableLastAccessUpdate/relatime.
      grounds: ["filestat:mtime column", "filestat:atime column",
                "scheduled-tasks:task XML NTFS mtime vs RegistrationInfo.Date"]
      enforcement: schema

    # ------------------------------------------------ 4. MUST NOT — pair claims
    - id: failed-logon-no-session
      level: MUST NOT
      scope: {family: evtx, when: Security 4625}
      statement: 4625 MUST NOT yield user_session.login — a failed logon opens no session.
      grounds: ["evtx:Security 4625 (note: labwork reclassification)", "labwork-findings#63"]
      enforcement: count-and-carry:evidence-matrix
    - id: channel-source-integrity
      level: MUST NOT
      scope: {family: evtx}
      statement: >-
        System/WLAN-channel ids (6005, 7001, 7034/7036, 7045, 8001/8002) MUST
        NOT be sourced from Security.evtx; an evtx row's Channel MUST match the
        declared `when` channel. Standing rule from the dfir-toolkit defect
        (DFIR.cmd:981,:987 aim System/WLAN ids at Security.evtx — only 4697
        can ever match there).
      grounds: ["evtx:System 7045 (note)", "evtx:System 7034/7036 (note)",
                "extract-dfir-toolkit.md:277-279"]
      enforcement: count-and-carry:channel-source
    - id: no-account-force-fit
      level: MUST NOT
      scope: {family: evtx}
      statement: >-
        Account-management ids (4720/4722-4726/4728/4732/4738/4740/4756) MUST
        NOT be force-fit onto authentication, user_session or service. Under
        the vocabulary ruling (docs/research/car-vocabulary-ruling.md) they
        bind ONLY to the promoted user_account / group objects — the original
        forbidden targets remain forbidden.
      grounds: ["extract-evtx-etw-resources.md:258-268", "evtx:Security 4688 (m365d 4720 half)",
                "docs/research/car-vocabulary-ruling.md"]
      enforcement: count-and-carry:evidence-matrix
    - id: no-task-force-fit
      level: MUST NOT
      scope: {family: [evtx, scheduled-tasks]}
      statement: >-
        Security 4698-4702 and TaskScheduler 106/140/141/200/201 MUST NOT be
        force-fit onto service, and 200/201 MUST NOT be bound to
        process.create (not asserted by any source). Under the vocabulary
        ruling they bind ONLY to the promoted scheduled_job object — the
        original forbidden targets remain forbidden.
      grounds: ["extract-evtx-etw-resources.md:270-273", "extract-dfir-toolkit.md:242-244",
                "docs/research/car-vocabulary-ruling.md"]
      enforcement: count-and-carry:evidence-matrix
    - id: no-sysmon-mis-object
      level: MUST NOT
      scope: {family: evtx}
      statement: >-
        Sysmon 17/18 (pipes) MUST NOT map to socket; 19/20/21 (WMI) and 22
        (DNS) MUST NOT be force-fit onto flow or http — declared objectless
        until the vocabulary grows.
      grounds: ["extract-evtx-etw-resources.md:275-278"]
      enforcement: count-and-carry:evidence-matrix
    - id: share-not-file
      level: MUST NOT
      scope: {family: evtx, when: Security 5140}
      statement: >-
        5140 names the SHARE object (C$), not a file: it MUST NOT be read as
        access to a specific file path; file-granular claims require 5145's
        RelativeTargetName.
      grounds: ["evtx:Security 5140", "evtx:Security 5145",
                "labwork-findings#59 (extract-labwork-findings.md:106-107)",
                "extract-dfir-toolkit.md:245-246"]
      enforcement: review
    - id: applocker-allow-only
      level: MUST NOT
      scope: {family: evtx, when: AppLocker EXE-and-DLL channel}
      statement: >-
        AppLocker BLOCK decisions (8003/8004) MUST NOT be read as
        process.execute — a blocked execution did not execute; the definitive
        execute claim is scoped to allow decisions (8002).
      grounds: ["evtx:AppLocker EXE-and-DLL channel, allow decisions (8002)",
                "extract-dfir-toolkit.md:103"]
      enforcement: count-and-carry:evidence-matrix

    # ------------------------------------------------ 5. Derivation MUSTs (SRO/wire)
    - id: edge-confidence-min
      level: MUST
      scope: {wire: relationship}
      statement: >-
        An SRO derived from a row MUST carry confidence = min(method tier,
        the evidencing row's declared tier) under {definitive:100,
        heuristic:50, inferred:20}; an edge from a heuristic-evidence row MUST
        NOT carry 100; from an inferred row MUST NOT exceed 20.
      grounds: ["model/stix/conventions.yml:207", "shimcache:AppCompatCache entry",
                "run-keys:Run* value names an executable"]
      enforcement: count-and-carry:evidence-tier
    - id: no-invented-instants
      level: MUST NOT
      scope: {wire: [relationship, observed-data]}
      statement: >-
        A bounded-time row MUST NOT populate SRO start_time or observed-data
        first/last_observed as the action instant (its stamp is a bound,
        carried in extension fields only); a time:none row MUST NOT mint an
        observed-data at all — it fills SCO/state only (the existing "an
        observation time is never invented" rule extended to bounds).
      grounds: ["model/stix/conventions.yml:182-184",
                "registry-hives:SYSTEM hive services enumeration",
                "run-keys:Run* value names an executable", "retrievir#98"]
      enforcement: count-and-carry:evidence-time
    - id: matched-is-overlay
      level: MUST NOT
      scope: {family: all}
      statement: >-
        This matched file is a source-grounded OVERLAY, not the closed gate
        set: the canonical evidences facet per family = the ir.json bootstrap
        closure UNION these rows. Gating emissions against this file alone
        MUST NOT be done (it would outlaw existing lanes — prefetch's
        (process, create), usnjrnl's (file, delete), wtmp's
        (user_session, logout) live in ir.json, not here).
      grounds: ["prefetch:schtasks.exe / recycler-path binaries in prefetch",
                "go/internal/ir/ir.json (plaso_exec_prefetch, l2t_usn_delete, l2t_utmp_logout)"]
      enforcement: review
    - id: row-grounding
      level: MUST
      scope: {family: all}
      statement: >-
        Every matrix row MUST cite at least one source, and tier
        disagreements MUST reconcile conservatively (weaker tier wins) — the
        file's own header rule, now normative and gated.
      grounds: ["matched-evidences.yaml:1-4", "evtx:Security 4648 (note)",
                "evtx:PowerShell 4103/4104 (note)"]
      enforcement: schema
