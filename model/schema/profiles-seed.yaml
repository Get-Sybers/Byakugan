    - {name: SequenceNumber, type: int, at: "gowindowlicker mft/tool.go:63"}
    - {name: InUse, type: bool, at: "gowindowlicker mft/tool.go:64"}
    - {name: ParentEntryNumber, type: int, at: "gowindowlicker mft/tool.go:65"}
    - {name: ParentSequenceNumber, type: int, at: "gowindowlicker mft/tool.go:66"}
    - {name: ParentPath, type: string, at: "gowindowlicker mft/tool.go:67"}
    - {name: FileName, type: string, at: "gowindowlicker mft/tool.go:68"}
    - {name: Extension, type: string, at: "gowindowlicker mft/tool.go:69"}
    - {name: FileSize, type: int, at: "gowindowlicker mft/tool.go:70"}
    - {name: ReferenceCount, type: int, at: "gowindowlicker mft/tool.go:71"}
    - {name: IsDirectory, type: bool, at: "gowindowlicker mft/tool.go:72"}
    - {name: HasAds, type: bool, at: "gowindowlicker mft/tool.go:73"}
    - {name: NameType, type: string, at: "gowindowlicker mft/tool.go:74"}
    - {name: SiFlags, type: string, at: "gowindowlicker mft/tool.go:75"}
    - {name: 'SI<FN', type: bool, at: "gowindowlicker mft/tool.go:76"}
    - {name: uSecZeros, type: bool, at: "gowindowlicker mft/tool.go:77"}
    - {name: LogfileSequenceNumber, type: int, at: "gowindowlicker mft/tool.go:78"}
    - {name: Created0x10, type: timestamp, at: "gowindowlicker mft/tool.go:79"}
    - {name: Created0x30, type: timestamp, at: "gowindowlicker mft/tool.go:80"}
    - {name: LastModified0x10, type: timestamp, at: "gowindowlicker mft/tool.go:81"}
    - {name: LastModified0x30, type: timestamp, at: "gowindowlicker mft/tool.go:82"}
    - {name: LastRecordChange0x10, type: timestamp, at: "gowindowlicker mft/tool.go:83"}
    - {name: LastRecordChange0x30, type: timestamp, at: "gowindowlicker mft/tool.go:84"}
    - {name: LastAccess0x10, type: timestamp, at: "gowindowlicker mft/tool.go:85"}
    - {name: LastAccess0x30, type: timestamp, at: "gowindowlicker mft/tool.go:86"}
