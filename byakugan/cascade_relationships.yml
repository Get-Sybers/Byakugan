# Relationship-instance verbs for the cascade, keyed by the spoke's (car_object,
# car_action). Every verb must exist in the ATT&CK relationship catalogue
# (attack_relationships.yml, generated by build_data_model from the pinned
# attack-datasources submodule); tests/test_superset.py enforces it.
#
# COVERAGE: every superset (object, action) pair of the 13 CAR objects has an
# explicit verb here, EXCEPT the eight decision-flagged pairs of
# docs/research/relationship-model-gaps.md §1/§9 (email's five actions,
# service/pause, socket/close, thread/suspend — no catalogue verb fits; held
# for the owner). tests/test_superset.py pins that exception list, so a new
# upstream action surfaces as a test failure, not a silent default.
# The grounding per verb — which ATT&CK data component, and whether the typed
# triple is exact or a Byakugan extension — is the register §1 table.

# process --verb--> spoke, keyed by the spoke's (car_object, car_action).
spoke_owner:
  file:
    access: accessed
    create: created
    read: accessed
    write: modified
    modify: modified
    delete: deleted
    acl_modify: modified
    timestomp: modified
    content: retrieved information about    # File Content (exact)
    metadata: retrieved information about   # File Metadata (exact)
  registry:
    add: created
    remove: deleted
    value_edit: modified
    key_edit: modified
    access: accessed                        # Windows Registry Key Access (exact)
    create: created                         # Windows Registry Key Creation (exact)
    delete: deleted                         # Windows Registry Key Deletion (exact)
    modify: modified                        # Windows Registry Key Modification (exact)
  module:
    load: loaded
    unload: unloaded                        # Driver Unload verb (extension: no module-unload component)
    content: retrieved information about    # Module Content (exact)
    metadata: retrieved information about   # Module Metadata (exact)
  driver:
    load: loaded
    unload: unloaded                        # Driver Unload (exact)
    metadata: retrieved information about   # Driver Metadata (host-sourced upstream; extension)
  flow:
    start: connected to
    message: connected to
    end: connected to
    create: connected to                    # Network Connection Creation (exact)
    content: connected to                   # informational components: the row IS a connection
    flow: connected to
  service:
    create: created
    stop: stopped
    start: started
    delete: deleted                         # CAR-only action; deletion-family verb (extension)
    modify: modified                        # Service Modification (exact)
    enumerate: listed                       # Service Enumeration (exact)
    metadata: retrieved information about   # Service Metadata (exact)
    access: accessed                        # Service Access (user-sourced upstream; extension)
  thread:
    remote_create: created
    create: created                         # Process Creation: process --created--> thread (exact)
    terminate: terminated                   # termination-family verb (extension)
  http:
    get: created
    post: created
    put: created                            # same family as get/post
    tunnel: connected to                    # a CONNECT proves a tunnel was REQUESTED (CAR-Relations §http)
  socket:
    bind: bound to
    listen: listened on                     # process --listened on--> port (exact)
  user_session:
    login: created
    reconnect: created
    logout: terminated
    unlock: unlocked
    lock: locked
    create: created                         # Logon Session Creation (user-sourced upstream; extension)
    terminate: terminated                   # Logon Session Termination (extension)
    metadata: retrieved information about   # Logon Session Metadata (extension)
  authentication:
    success: requested
    failure: requested
    error: requested

# the verb for a spoke whose (object, action) is not listed above — reserved
# for the decision-flagged pairs and for drift; a pair that is neither is a
# test failure (test_superset.py), never a silent fallback.
default_spoke_verb: accessed

# the special cascade edges (not simple spoke->owner)
edges:
  parent_process: created      # parent --created--> child process
  process_access: accessed     # source --accessed--> target (Sysmon 10)
  thread_injection: accessed   # source --accessed--> target (CreateRemoteThread = Process Access)
  file_executed: executed      # process --executed--> file (image_path, CAR-2014-02-001)
  auth_session: created        # authentication --created--> logon session (LUID)
  flow_contains: contained     # flow --contained--> http/file riding it (R3, the shared zeek uid;
                               # Network Traffic Content aliased)
  process_modify: modified     # modifier --modified--> process (Process Modification: tampering /
                               # hollowing; fires on native.modifier_process_guid — the declared
                               # native-key contract, like TargetProcessGuid for injection)

# ---------------------------------------------------------------------------
# Association properties — facts OF a relationship, not of either endpoint
# (the #107/#108 file-handle pattern; register §4). Carried in the edge row's
# `properties` (-> car.rel.properties). Keyed by "<object>/<action>" for a
# spoke->owner edge, or "edge:<name>" for a special edge. Each property names
# its sources on the EMITTING event row — a CAR field, or native.<Key> —
# first non-null wins. A property is DUPLICATED onto the edge, never moved:
# the row keeps its column (the object model is not changed here).
association_properties:
  file/access:                              # the handle's own facts (#108)
    access_level: [native.GrantedAccess]
    handle_value: [native.HandleValue]
  file/timestomp:
    previous_creation_time: [previous_creation_time]   # the pre-tamper value: the CHANGE is the edge's fact
  file/acl_modify:
    previous_acl: [native.OldSd]            # 4670 old/new security descriptor (audit family)
    new_acl: [native.NewSd]
  registry/value_edit:
    new_content: [new_content]              # what THIS edit wrote (Sysmon 13 Details / 14 NewName)
  registry/key_edit:
    new_content: [new_content]
  module/load:
    base_address: [base_address]            # where the image sits in the LOADER's address space
    tid: [tid]                              # the loading thread
  driver/load:
    base_address: [base_address]
  edge:process_access:                      # facts of the (source, target) access itself
    access_level: [access_level, native.GrantedAccess]
    call_trace: [call_trace, native.CallTrace]
    target_address: [target_address]
  edge:thread_injection:                    # where execution begins IN the target (Sysmon 8)
    start_address: [start_address, native.StartAddress]
    start_function: [start_function, native.StartFunction]
    start_module: [start_module, native.StartModule]
    new_thread_id: [tgt_tid, native.NewThreadId]
