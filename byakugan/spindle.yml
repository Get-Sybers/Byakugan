---
# The spindle registry's notes — the half the engine does not read.
#
# The identity RULES — per entry the CAR object, kind, scope, identity-key
# version and the ordered identity fields; the positional fallback; the
# engine-minted external forms; the golden vectors — are authored with the
# maps, in Go (go/internal/authoring/ir_sections.go, the `spindle` and
# `golden` sections), serialised into go/internal/ir/ir.json and read back by
# byakugan.spindle: one statement, the one the engine mints with. This file
# carries what the engine does not need: the scope/kind vocabulary prose, a
# note per entry (which tools the key is validated against; what it holds
# across), the cross-source EQUALITY rule (a Python-side predicate), and the
# external forms the Anamnesis memory passthrough brings in (never minted
# here). byakugan.spindle.rules() assembles the two halves;
# `python -m byakugan.spindle --check` holds them, the maps and the recipe in
# step. The recipe, value sources, golden vectors and the version-bump change
# protocol: docs/Spindle-Identity.md.

spindle:
  # SCOPE — the vocabulary an entry's `scope` and a row's native.spindle_scope share
  scopes:
    intrinsic: >-
      minted from the artefact's own identity fields — the same across tools, runs and sources of
      one image; a row whose components are incomplete falls back to positional
    positional: >-
      minted from the per-record index (SourceImage + RecordId) — deterministic inside this source
      only; never equated across sources
  # KIND — what an entry's key ASSERTS when two rows share it
  kinds:
    record: >-
      a record-numbered / journal key: the SAME record (an MFT entry, a USN record, a journal id,
      a log record number)
    entity: >-
      a content-like key: records that COINCIDE on the entity (a path + hash, a path + stamp, a
      program + run time)

# One note per identity entry of the IR's spindle section (named by map key, or
# <map>/<variant>): which tools the key is validated against — plaso only, i.e.
# cross-run within the tool, until a second tool's map renders the same key on
# a real record — and what the key holds across. The entry itself (object,
# kind, scope, version, identity fields, golden vector) lives in Go.
identities:
  # ---- Plaso filesystem (go/internal/authoring/maps_plaso_linux.go) --------------------------
  l2t_filestat:    # golden: real: M57-JO filestat row (tests/test_spindle_ids.py _FILESTAT); the fixture's wrap time
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources of one image: the path + its stamp — the parsed file IS the file
  l2t_mft:    # golden: synthetic: no real mft row in the corpus (tests/test_spindle_ids.py _MFT)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources of one image: the NTFS entry reference (entry | sequence << 48) +
      the stamp; a second tool must render the combined reference (to-be-validated)
  l2t_usnjrnl:    # golden: real: M57-JO usnjrnl row (tests/test_spindle_ids.py _USN)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources of one image: the journal's own USN; the entry reference keeps the
      key self-describing
  # ---- Linux sessions (go/internal/authoring/maps_plaso_linux.go) ----------------------------
  l2t_utmp:    # golden: real: dualserver wtmp USER_PROCESS row (tests/test_car_plaso_linux.py _UTMP); the fixture's wrap time
    validated_against: [plaso]
    stable_across: >-
      runs and sources of one image: the session leader's pid + terminal + the record stamp
  l2t_utmpx:    # golden: synthetic: no utmpx row in the corpus; shaped like the utmp one
    validated_against: [plaso]
    stable_across: >-
      runs and sources of one image: the session leader's pid + terminal + the record stamp
  l2t_text:    # golden: real: dualserver sshd Accepted row (tests/test_car_plaso_linux.py _SSH); the fixture's wrap time
    validated_against: [plaso]
    stable_across: >-
      runs and sources of one image: the handling sshd's pid + user + the log line's stamp
  # ---- Windows file artefacts (go/internal/authoring/maps_plaso_artifacts.go, plaso_shellitem.go)
  l2t_lnk:    # golden: synthetic: M57-JO-shaped (tests/test_car_plaso_web.py; the shortcut path is not the real one)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the shortcut file + its recorded target + the target's stamp
  l2t_recyclebin:    # golden: synthetic: M57-JO-shaped (tests/test_car_plaso_web.py)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the $I / INFO2 record file + the original path + the deletion stamp
  plaso_shellitem:    # golden: synthetic: a shell item embedded in the lnk above
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the embedding origin + the item's path + the stamp
  # ---- other filesystem/file parsers (go/internal/authoring/maps_plaso_fs_extra.go) -----------
  plaso_fseventsd:    # golden: synthetic: no fseventsd row in the corpus; the plaso FSEvents record shape
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the journal's own event id + the path it names
  plaso_pecoff:    # golden: synthetic: tests/test_car_plaso_fs_extra.py _PE_HEADER
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: path + content hash; no stamp
  plaso_olecf:    # golden: synthetic: no olecf row in the corpus; an OLE document's summary-info row
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the document's path + the summary-info stamp
  # ---- execution evidence (go/internal/authoring/maps_plaso_exec.go, plaso_srum.go) -----------
  plaso_exec_prefetch:    # golden: real: M57-JO SVCHOST.EXE-3530F672.pf run (tests/test_car_plaso_exec.py _PREFETCH_EXEC)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the executable + the .pf name hash + the run time; PECmd renders
      the hash as hex (to-be-validated)
  plaso_exec_winreg/amcache:    # golden: synthetic: no amcache row in the corpus (tests/test_car_plaso_exec.py _AMCACHE)
    validated_against: [plaso]
    stable_across: >-
      runs and sources: the program path + the key-write stamp (recorded, never a run time)
  plaso_exec_winreg/amcache_link_time:    # golden: synthetic: the same entry's Link Time row (tests/test_car_plaso_exec.py _AMCACHE_LINK)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the program path + its own SHA-1; no stamp
  plaso_exec_winreg/userassist:    # golden: real: M57-JO UserAssist row (tests/test_car_plaso_exec.py _USERASSIST_RUNPATH)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the per-user Count key + the value name + the stamp
  plaso_exec_winreg/bam:    # golden: synthetic: no bam row in the corpus (tests/test_car_plaso_exec.py _BAM)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the per-user bam key + the program path + the stamp
  plaso_exec_winreg/appcompatcache:    # golden: real: M57-JO AppCompatCache row (tests/test_car_plaso_exec.py _APPCOMPAT)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the program path + the cached file's mtime; the per-ControlSet
      copies are one identity
  plaso_exec_cron:    # golden: real: dualserver cron task-run row (tests/test_car_plaso_exec.py _CRON)
    validated_against: [plaso]
    stable_across: >-
      runs and sources: the command + pid + the log line's stamp
  l2t_srum/network_usage:    # golden: synthetic: LoneWolf-shaped (tests/test_car_srum_recmd.py)
    validated_against: [plaso]
    stable_across: >-
      runs and sources: the application + user identifier + interface + the recorded hour
  l2t_srum/application_usage:    # golden: synthetic: LoneWolf-shaped (tests/test_car_srum_recmd.py)
    validated_against: [plaso]
    stable_across: >-
      runs and sources: the application + user identifier + the recorded hour
  # ---- registry (go/internal/authoring/maps_plaso_registry.go) --------------------------------
  plaso_registry:    # golden: synthetic: M57-JO-shaped Run key snapshot (tests/test_spindle_ids.py _REGISTRY)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the hive file + key path + its last-write stamp; key-level, no
      value component (to-be-validated)
  # ---- browser / download caches (go/internal/authoring/maps_plaso_web.go) --------------------
  l2t_msiecf:    # golden: synthetic: M57-JO-shaped visit (tests/test_car_plaso_web.py; the index.dat path is not the real one)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the browser database file + the cleaned URL + the visit stamp; the
      db_path rendering is to-be-validated
  l2t_firefox_cache:    # golden: synthetic: M57-JO-shaped (tests/test_car_plaso_web.py)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the browser database file + the cleaned URL + the visit stamp; the
      db_path rendering is to-be-validated
  l2t_firefox_places:    # golden: synthetic: M57-JO-shaped (tests/test_car_plaso_web.py)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the browser database file + the cleaned URL + the visit stamp; the
      db_path rendering is to-be-validated
  l2t_javaidx:    # golden: synthetic: M57-JO-shaped (tests/test_car_plaso_web.py)
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources: the browser database file + the cleaned URL + the visit stamp; the
      db_path rendering is to-be-validated

# One note per engine-minted external form of the IR's spindle section: what the
# sensor's or tool's own id holds across. The form, kind and golden vector live in Go.
external:
  esedump_srum_application:    # golden: real: LoneWolf SRUDB.dat ApplicationResourceUsage
    stable_across: >-
      one SRUM ApplicationResourceUsage row (ese_dump): the app + user + the recorded time — the
      aggregate's own key
  esedump_srum_network:    # golden: real: LoneWolf SRUDB.dat NetworkDataUsage (scratchpad stage3-parity)
    stable_across: >-
      one SRUM NetworkDataUsage aggregate row (ese_dump): the app + user + interface + the
      recorded time + the byte counts — the aggregate's own key
  evtx_record:    # golden: real: LoneWolf Security 4688 (tests/test_car_winevt_adapter.py)
    stable_across: >-
      runs and tools over the same .evtx: the log's own record number, per channel and host
      (EvtxECmd and the Plaso winevtx route agree)
  jlecmd_entry:    # golden: synthetic (tests/test_car_jlecmd.py shape)
    stable_across: >-
      one DestList entry of one jump-list file (JLECmd's own numbering)
  memory_proc_offset:    # golden: synthetic: 0x1a2b -> proc-1a2b (tests/test_derive.py)
    stable_across: >-
      one memory image — the _EPROCESS offset Anamnesis mints proc-<hex> from
  prefetch_dump_pf:    # golden: real: LoneWolf ADDINUTIL.EXE-4E6085D4.pf
    stable_across: >-
      one Windows Prefetch file (prefetch_dump): the executable + the .pf path hash — the pair the
      .pf filename itself is keyed on
  recmd_value:    # golden: synthetic (tests/test_car_srum_recmd.py shape)
    stable_across: >-
      one value of one key of one hive file (RECmd batch output)
  sysmon_process_guid:    # golden: real: a Sysmon ProcessGuid (tests/test_car_winevt_adapter.py)
    stable_across: >-
      every Sysmon event of one process, on any tool that parses the log: the sensor's own process
      guid
  zeek_cert_fp:    # golden: synthetic (tests/test_car_zeek_x509.py)
    stable_across: >-
      one X.509 certificate (its SHA-256 fingerprint) — stable across captures
  zeek_fuid:    # golden: synthetic (tests/test_car_zeek_extra.py)
    stable_across: >-
      one file transfer within one capture; http.log names it in resp_fuids
  zeek_uid:    # golden: synthetic: Zeek uid shape (tests/test_car_zeek_conn.py)
    stable_across: >-
      every Zeek log of one connection in one capture — conn / http / files / ssl share the uid
  zeek_uid_trans_depth:    # golden: synthetic (tests/test_car_zeek_extra.py)
    stable_across: >-
      one HTTP transaction within its connection, in one capture
  zeek_uid_trans_id:    # golden: synthetic (tests/test_car_zeek_dns.py)
    stable_across: >-
      one DNS transaction (query/answer) within its connection, in one capture

# The external forms the Anamnesis memory passthrough carries verbatim (its
# car.db rows keep the guids Anamnesis minted): declared here in full, because
# the engine never mints them and the IR does not know them. verify_registry
# requires carried_by on each.
passthrough:
  memory_file_object:
    kind: entity
    form: {form: 'file-{hex}'}
    stable_across: one memory image — the FILE_OBJECT offset Anamnesis mints file-<hex> from
    golden:                     # synthetic: 0x1a2b -> file-1a2b
      source: synthetic
      object: file
      values: {offset: 6699}
  # ---- Anamnesis interchange forms (carried_by; fields render DECIMAL via
  # value.Str). Declared so kind/scope/stability are on record — the equality
  # predicate equates external forms by exact value, so what each form may
  # honestly be equated ACROSS is stated per entry (register §5). ----------
  memory_thread_offset:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Offset]}    # thread-<offset, decimal>
    stable_across: >-
      one memory image — the _ETHREAD offset (windows.thrdscan /
      windows.anamnesis.threads); never comparable across images
    golden:                     # synthetic: offset 6699 -> thread-6699
      source: synthetic
      object: thread
      values: {Offset: 6699}
  memory_module_load:
    kind: entity
    carried_by: anamnesis
    form: {fields: [PID, Base]}   # module-<pid>-<base, decimal>
    stable_across: >-
      one memory image — a load is identified by the owning pid + the base it
      is mapped at (windows.dlllist / windows.anamnesis.modules); pid reuse
      makes it meaningless across boots or images
    golden:                     # synthetic
      source: synthetic
      object: module
      values: {PID: 10, Base: 1904640}
  memory_driver_offset:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Offset]}    # driver-<offset, decimal>
    stable_across: one memory image — the driver object's offset (windows.modules)
    golden:                     # synthetic
      source: synthetic
      object: driver
      values: {Offset: 6700}
  memory_service_offset:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Offset]}    # service-<offset, decimal>
    stable_across: >-
      one memory image — the service record's offset (windows.svcscan, an
      enumerate snapshot); never comparable across images
    golden:                     # synthetic
      source: synthetic
      object: service
      values: {Offset: 6701}
  memory_socket_tuple:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Proto, LocalAddr, LocalPort, PID]}   # socket-<proto>-<addr>-<port>-<pid>
    stable_across: >-
      ONE memory snapshot — a bound/listening endpoint by protocol + local
      endpoint + owner pid (netscan/netstat/anamnesis.network). NOT stable
      across snapshots of the same host: a rebind after restart coincides on
      the tuple without being the same socket — never equate across snapshots
    golden:                     # synthetic
      source: synthetic
      object: socket
      values: {Proto: TCPv4, LocalAddr: 0.0.0.0, LocalPort: 135, PID: 924}
  memory_flow_tuple:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Proto, LocalAddr, LocalPort, ForeignAddr, ForeignPort]}
    stable_across: >-
      ONE memory snapshot — a connection by its 5-tuple
      (netscan/netstat/anamnesis.network). NOT stable across snapshots:
      ephemeral-port reuse re-mints the tuple for a different connection
    golden:                     # synthetic
      source: synthetic
      object: flow
      values: {Proto: TCPv4, LocalAddr: 10.0.0.5, LocalPort: 49713,
               ForeignAddr: 100.101.0.42, ForeignPort: 443}
  memory_registry_value:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Hive, Key, ValueName]}   # registry-<hive>-<key>-<value>
    stable_across: >-
      one memory image — value-level (hive + key + value name,
      windows.anamnesis.registry), unlike the disk lane's key-level
      plaso_registry snapshot identity
    golden:                     # synthetic
      source: synthetic
      object: registry
      values: {Hive: \REGISTRY\MACHINE\SOFTWARE,
               Key: 'Microsoft\Windows\CurrentVersion\Run', ValueName: Updater}
  memory_session_luid:
    kind: entity
    carried_by: anamnesis
    form: {form: 'user_session-{value}'}   # also the derive rule's luid guid_form
    stable_across: >-
      one boot of one host — the logon-session LUID
      (windows.anamnesis.sessions), the same key the auth_session_luid join
      uses; the well-known per-boot singletons (0x3e4/0x3e5/0x3e7) recur
      every boot and identify nothing across boots
    golden:                     # synthetic: LUID 0x51ca9 -> user_session-0x51ca9
      source: synthetic
      object: user_session
      values: {value: '0x51ca9'}
  memory_session_index:
    kind: entity
    carried_by: anamnesis
    form: {fields: ['Session ID', 'User Name']}   # user_session-<id>-<user>
    stable_across: >-
      one memory image — the windows.sessions row by session id + user;
      session ids recycle across boots
    golden:                     # synthetic
      source: synthetic
      object: user_session
      values: {'Session ID': 1, 'User Name': jo}
  memory_file_mft:
    kind: record
    carried_by: anamnesis
    form: {form: 'file-mft-{value}'}   # the MFT-scan fold's record key (enrich.go)
    stable_across: >-
      one memory image — the in-memory $MFT record number the mftscan fold
      keys its file row on; record numbers recycle after deletion, so never
      comparable across images (the disk lane's l2t_mft uses the FULL NTFS
      reference — entry | sequence<<48 — which this form does not)
    golden:                     # synthetic: record 843 -> file-mft-843
      source: synthetic
      object: file
      values: {value: 843}
  memory_file_scan_offset:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Offset]}    # file-<offset, DECIMAL> (windows.filescan)
    stable_across: >-
      one memory image — the FILE_OBJECT offset, rendered DECIMAL by
      windows.filescan while windows.anamnesis.files mints file-<HEX>
      (memory_file_object): the same offset yields two identities that never
      equate. On record until the Anamnesis-side rendering is unified
    golden:                     # synthetic: offset 6699 -> file-6699 (vs file-1a2b hex)
      source: synthetic
      object: file
      values: {Offset: 6699}

# ---------------------------------------------------------------------------
# CROSS-SOURCE EQUALITY — the rule #41 (PR B, union_edges in crosssource)
# implements; the predicate is spindle.equatable_across_sources(row). Two rows
# from two sources are the same row-identity ONLY on EXACT equality of
# (case, source_host, car_object, guid), where both rows are intrinsic, both
# entries are of kind record | entity, and both keys carry the same _v (a
# store pair at mixed versions is refused, never bridged). A positional
# identity is never equated. An external form — a sensor's or tool's own id —
# equates by exact value. The boundary is the CASE: the batch tree (`--case`,
# default the tree's basename); no car.db column is added for it.

equality:
  rule: exact
  key: [case, source_host, car_object, guid]
  requires:
    scope: intrinsic
    kind: [record, entity]
    same_version: true          # equal _v on both keys
  never: positional
  external: exact value
  boundary:
    case: the batch tree (--case; default its basename) — no new car.db column
  implemented_by: "#41 PR B (crosssource union_edges); this registry ships the rule and the predicate"
