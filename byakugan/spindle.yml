    kind: entity
    carried_by: anamnesis
    form: {fields: [Hive, Key, ValueName]}   # registry-<hive>-<key>-<value>
    stable_across: >-
      one memory image — value-level (hive + key + value name,
      windows.anamnesis.registry), unlike the disk lane's key-level
      plaso_registry snapshot identity
    golden:                     # synthetic
      source: synthetic
      object: registry
      values: {Hive: \REGISTRY\MACHINE\SOFTWARE,
               Key: 'Microsoft\Windows\CurrentVersion\Run', ValueName: Updater}
  memory_session_luid:
    kind: entity
    carried_by: anamnesis
    form: {form: 'user_session-{value}'}   # also the derive rule's luid guid_form
    stable_across: >-
      one boot of one host — the logon-session LUID
      (windows.anamnesis.sessions), the same key the auth_session_luid join
      uses; the well-known per-boot singletons (0x3e4/0x3e5/0x3e7) recur
      every boot and identify nothing across boots
    golden:                     # synthetic: LUID 0x51ca9 -> user_session-0x51ca9
      source: synthetic
      object: user_session
      values: {value: '0x51ca9'}
  memory_session_index:
    kind: entity
    carried_by: anamnesis
    form: {fields: ['Session ID', 'User Name']}   # user_session-<id>-<user>
    stable_across: >-
      one memory image — the windows.sessions row by session id + user;
      session ids recycle across boots
    golden:                     # synthetic
      source: synthetic
      object: user_session
      values: {'Session ID': 1, 'User Name': jo}
  memory_file_mft:
    kind: record
    carried_by: anamnesis
    form: {form: 'file-mft-{value}'}   # the MFT-scan fold's record key (enrich.go)
    stable_across: >-
      one memory image — the in-memory $MFT record number the mftscan fold
      keys its file row on; record numbers recycle after deletion, so never
      comparable across images (the disk lane's l2t_mft uses the FULL NTFS
      reference — entry | sequence<<48 — which this form does not)
    golden:                     # synthetic: record 843 -> file-mft-843
      source: synthetic
      object: file
      values: {value: 843}
  memory_file_scan_offset:
    kind: entity
    carried_by: anamnesis
    form: {fields: [Offset]}    # file-<offset, DECIMAL> (windows.filescan)
    stable_across: >-
      one memory image — the FILE_OBJECT offset, rendered DECIMAL by
      windows.filescan while windows.anamnesis.files mints file-<HEX>
      (memory_file_object): the same offset yields two identities that never
      equate. On record until the Anamnesis-side rendering is unified
    golden:                     # synthetic: offset 6699 -> file-6699 (vs file-1a2b hex)
      source: synthetic
      object: file
      values: {Offset: 6699}

# ---------------------------------------------------------------------------
# CROSS-SOURCE EQUALITY — the rule #41 (PR B, union_edges in crosssource)
# implements; the predicate is spindle.equatable_across_sources(row). Two rows
# from two sources are the same row-identity ONLY on EXACT equality of
# (case, source_host, car_object, guid), where both rows are intrinsic, both
# entries are of kind record | entity, and both keys carry the same _v (a
# store pair at mixed versions is refused, never bridged). A positional
# identity is never equated. An external form — a sensor's or tool's own id —
# equates by exact value. The boundary is the CASE: the batch tree (`--case`,
# default the tree's basename); no car.db column is added for it.
equality:
  rule: exact
  key: [case, source_host, car_object, guid]
  requires:
    scope: intrinsic
    kind: [record, entity]
    same_version: true          # equal _v on both keys
  never: positional
  external: exact value
  boundary:
    case: the batch tree (--case; default its basename) — no new car.db column
  implemented_by: "#41 PR B (crosssource union_edges); this registry ships the rule and the predicate"
