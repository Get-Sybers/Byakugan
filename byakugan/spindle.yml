---
# The row-identity registry — the recipe, value sources, golden vectors and
# the version-bump change protocol: docs/Spindle-Identity.md. Entries are
# DATA; the engine (ids.mint) implements the mechanics, and
# `python -m byakugan.spindle --check` holds registry and maps in step.

spindle:
  version: 2                  # 2: CAR_NS re-seeded to the byakugan project URL — a new
                              #    spindle: every guid re-mints, stores need a rebuild
  namespace:
    parent: CAR_NS            # ids.CAR_NS = uuid5(NAMESPACE_URL, the project URL)
    label: spindle            # ids.SPINDLE_NS = uuid5(CAR_NS, label)
  object_key: _obj            # the key carrying the CAR object in the identity key
  version_key: _v             # the key carrying the entry's identity-key version (an int)
  # how a value enters the key: `str` (global — a scalar in its string form, a
  # structured value as canonical JSON text) unless a field overrides it with
  # `normalize: json` (type-faithful canonical JSON text). None override in v1.
  rendering: str
  normalize: [str, json]
  # the per-record index the l2t container splitter (go/internal/split) stamps
  # on every wrapped row —
  # the POSITIONAL identity a row falls back to when a component of its
  # intrinsic identity is blank (raw wrapped-row fields, not event fields);
  # it is versioned like an entry
  positional:
    fields: [SourceImage, RecordId]
    version: 1
    golden:                     # synthetic: the container + the physical line
      source: synthetic
      object: file
      values: {SourceImage: M57-JO.jsonl, RecordId: 42}
  # SCOPE — the vocabulary an entry's `scope` and a row's native.spindle_scope share
  scopes:
    intrinsic: >-
      minted from the artefact's own identity fields — the same across tools, runs and
      sources of one image; a row whose components are incomplete falls back to positional
    positional: >-
      minted from the per-record index (SourceImage + RecordId) — deterministic inside this
      source only; never equated across sources
  # KIND — what an entry's key ASSERTS when two rows share it
  kinds:
    record: >-
      a record-numbered / journal key: the SAME record (an MFT entry, a USN record, a
      journal id, a log record number)
    entity: >-
      a content-like key: records that COINCIDE on the entity (a path + hash, a path +
      stamp, a program + run time)

# entry fields and value-source paths: docs/Spindle-Identity.md
# "Identity value sources"
identities:
  # ---- Plaso filesystem (mappings/plaso_linux.py) --------------------------
  l2t_filestat:
    object: file
    kind: entity
    scope: intrinsic
    version: 1
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources of one image: the path + its stamp — the parsed file IS the file
    identity:
      file_path: file_path                     # the parsed file IS the file
      event_time: timestamp
    golden:                                    # real: M57-JO filestat row (tests/test_spindle_ids.py _FILESTAT); the fixture's wrap time
      source: real
      values:
        file_path: '\Program Files\app\FPEXT.MSG'
        event_time: '2020-09-16T13:14:30.462820Z'
  l2t_mft:
    object: file
    kind: record
    scope: intrinsic
    version: 1
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources of one image: the NTFS entry reference (entry | sequence << 48)
      + the stamp; a second tool must render the combined reference (to-be-validated)
    identity:
      file_reference: native.file_reference    # the NTFS entry (entry | sequence << 48)
      event_time: timestamp
    golden:                                    # synthetic: no real mft row in the corpus (tests/test_spindle_ids.py _MFT)
      source: synthetic
      values:
        file_reference: 843
        event_time: '2020-09-16T13:14:30.462820Z'
  l2t_usnjrnl:
    object: file
    kind: record
    scope: intrinsic
    version: 1
    validated_against: [plaso]
    stable_across: >-
      tools, runs and sources of one image: the journal's own USN; the entry reference keeps
      the key self-describing
    identity:
      usn: native.update_sequence_number       # a change-journal record is unique by its USN
      file_reference: native.file_reference    # keeps the key self-describing (the usnjrnl<->mft join key)
    golden:                                    # real: M57-JO usnjrnl row (tests/test_spindle_ids.py _USN)
      source: real
      values:
        usn: 1048576
        file_reference: 281474976727294
  # ---- Linux sessions (mappings/plaso_linux.py) ----------------------------
  l2t_utmp:
    object: user_session
    kind: entity
    scope: intrinsic
    version: 1
    validated_against: [plaso]
    stable_across: >-
      runs and sources of one image: the session leader's pid + terminal + the record stamp
    identity:
      pid: owning_pid                          # the session leader
      terminal: native.terminal
      event_time: timestamp
    golden:                                    # real: dualserver wtmp USER_PROCESS row (tests/test_car_plaso_linux.py _UTMP); the fixture's wrap time
      source: real
      values:
        pid: 3401
        terminal: tty7
        event_time: '2020-09-16T13:14:30.462820Z'
  l2t_utmpx:
    object: user_session
    kind: entity
    scope: intrinsic
    version: 1
    validated_against: [plaso]
    stable_across: >-
      runs and sources of one image: the session leader's pid + terminal + the record stamp
    identity:
      pid: owning_pid
