# ---------------------------------------------------------------------------
# EXTERNAL forms — every raw guid form a non-Plaso map uses, as data: a
# sensor's or tool's OWN id, carried verbatim (never wrapped in uuid5). A form
# is `fields` (<object>-<f1>-<f2>…, normalize._guid), `field` (the value),
# `marker: {payload: <name>}` (a value out of the EvtxECmd Payload) or `form`
# (the guid a producing tool mints — a derive guid_form; "{value}" renders the
# raw value). Each carries a kind and a golden sample; verify_registry holds
# every map leaf's guid spec to exactly one of these, and every one of these
# to a map, a derive rule, or an interchange producer named by `carried_by`
# (its rows arrive verbatim through a passthrough reader) — no raw form
# undeclared, no mapped row guid-less by design.
external:
  evtx_record:
    kind: record
    form: {fields: [Computer, Channel, EventRecordId]}
    stable_across: >-
      runs and tools over the same .evtx: the log's own record number, per channel and
      host (EvtxECmd and the Plaso winevtx route agree)
    golden:                     # real: LoneWolf Security 4688 (tests/test_car_winevt_adapter.py)
      source: real
      object: process
      values: {Computer: WIN-1M3263ACE5D, Channel: Security, EventRecordId: 2623}
  sysmon_process_guid:
    kind: entity
    form: {marker: {payload: ProcessGuid}}
    stable_across: >-
      every Sysmon event of one process, on any tool that parses the log: the sensor's own
      process guid
    golden:                     # real: a Sysmon ProcessGuid (tests/test_car_winevt_adapter.py)
      source: real
      object: process
      values: {ProcessGuid: '{DFAE8213-70EB-5CDD-0000-0010F66D0A00}'}
  zeek_uid:
    kind: entity
    form: {field: uid}
    stable_across: every Zeek log of one connection in one capture — conn / http / files / ssl share the uid
    golden:                     # synthetic: Zeek uid shape (tests/test_car_zeek_conn.py)
      source: synthetic
      object: flow
      values: {uid: CtEReq24zLXEGt4V67}
  zeek_uid_trans_depth:
    kind: record
    form: {fields: [uid, trans_depth]}
    stable_across: one HTTP transaction within its connection, in one capture
    golden:                     # synthetic (tests/test_car_zeek_extra.py)
      source: synthetic
      object: http
      values: {uid: Cno6, trans_depth: 1}
  zeek_uid_trans_id:
    kind: record
    form: {fields: [uid, trans_id]}
    stable_across: one DNS transaction (query/answer) within its connection, in one capture
    golden:                     # synthetic (tests/test_car_zeek_dns.py)
      source: synthetic
      object: flow
      values: {uid: CEVU, trans_id: 23150}
  zeek_cert_fp:
    kind: entity
    form: {field: fingerprint}
    stable_across: one X.509 certificate (its SHA-256 fingerprint) — stable across captures
    golden:                     # synthetic (tests/test_car_zeek_x509.py)
      source: synthetic
      object: file
      values: {fingerprint: bac9e9e2d4e38c7716fc17dcd701dd45e226cd9b623f21e9a145921fb5b6dc4d}
  zeek_fuid:
    kind: entity
    form: {fields: [fuid]}
    stable_across: one file transfer within one capture; http.log names it in resp_fuids
    golden:                     # synthetic (tests/test_car_zeek_extra.py)
      source: synthetic
      object: file
      values: {fuid: FdEQ}
  jlecmd_entry:
    kind: record
    form: {fields: [SourceFile, EntryNumber]}
