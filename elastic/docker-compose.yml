name: byakugan-standalone

# Byakugan's STANDALONE Elastic stack (posture, coexistence with DX_DFIR's
# stack and bring-up order: elastic/README.md). A loopback-published LAB
# stack: security ON, HTTP TLS deliberately OFF — the TLS/CA code path is
# exercised against the DX_DFIR-integrated stack instead. The project name
# and the 9201/5602 ports are deliberately offset from DX_DFIR's so both
# stacks coexist on one host.
# Host prerequisite: sudo sysctl -w vm.max_map_count=262144

services:
  elasticsearch:
    image: "docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.4.3}"
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?set it in elastic/.env (see .env.example)}"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      # a lab-sane default heap; bump both ES_JAVA_OPTS and mem_limit together
      # if you load a large case (keep the heap at <= ~50% of mem_limit)
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    mem_limit: 2g
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${BYAKUGAN_STANDALONE_ES_PORT:-9201}:9200"
    healthcheck:
      # security answers AND rejects the unauthenticated call: the posture
      # check (no TLS here, so no --cacert, unlike DX_DFIR's own healthcheck)
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot: waits for Elasticsearch, then sets the kibana_system password
  # and creates the least-privilege byakugan_loader identity (both
  # idempotent). No certificate generation — see the header comment above.
  setup:
    image: "docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.4.3}"
    command: ["bash", "/usr/local/bin/byakugan-standalone-setup"]
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?set it in elastic/.env (see .env.example)}"
      KIBANA_SYSTEM_PASSWORD: "${KIBANA_SYSTEM_PASSWORD:?set it in elastic/.env (see .env.example)}"
      BYAKUGAN_LOADER_PASSWORD: "${BYAKUGAN_LOADER_PASSWORD:?set it in elastic/.env (see .env.example)}"
    volumes:
      - ./config/setup.sh:/usr/local/bin/byakugan-standalone-setup:ro

  kibana:
    image: "docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.4.3}"
    depends_on:
      setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      SERVER_NAME: byakugan-standalone-kibana
      SERVER_PUBLICBASEURL: "http://127.0.0.1:${BYAKUGAN_STANDALONE_KIBANA_PORT:-5602}"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: "${KIBANA_SYSTEM_PASSWORD:?set it in elastic/.env (see .env.example)}"
      TELEMETRY_OPTIN: "false"
      # The three Kibana encryption keys (>= 32 chars each; openssl rand -hex 32).
      # Not optional even for this lab stack: Kibana 9.x runs its Fleet setup
      # unconditionally at boot, and without the saved-objects key it retries
      # forever (FleetEncryptedSavedObjectEncryptionKeyRequired) — the live e2e
      # gate caught exactly that. Same var names as the DX_DFIR stack.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY:?set it in elastic/.env (see .env.example)}"
      XPACK_SECURITY_ENCRYPTIONKEY: "${KIBANA_SECURITY_ENCRYPTION_KEY:?set it in elastic/.env (see .env.example)}"
      XPACK_REPORTING_ENCRYPTIONKEY: "${KIBANA_REPORTING_ENCRYPTION_KEY:?set it in elastic/.env (see .env.example)}"
    mem_limit: 1g
    volumes:
      - kibanadata:/usr/share/kibana/data
    ports:
      - "127.0.0.1:${BYAKUGAN_STANDALONE_KIBANA_PORT:-5602}:5601"
    healthcheck:
      # ready once the login redirect is served (503 "not ready yet" until then)
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302'"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  # bare names: compose prefixes every volume with the project name above
  # (byakugan-standalone_esdata, ...), which is what actually keeps this
  # stack's data apart from DX_DFIR's own byakugan_esdata/byakugan_kibanadata.
  esdata:
  kibanadata:
