# HAND-AUTHORED contract — validated by `python elastic/projection/validate.py`.
# Projection of a relationship-timeline row (byakugan/superset.py
# REL_COLUMNS, exported as car_relationships.jsonl) onto the logs-car.rel-<namespace>
# data stream — the granular relationship TIMELINE (source_object --relationship-->
# target_object edges, both DECLARED and DERIVED), as distinct from the
# object-level logs-car.<object>-* streams objects/*.yml projects.
#
# Not a CAR object: `rel` here names this projection file, not one of the 13
# model/car/objects/*.yml entries validate.py cross-checks objects/*.yml
# against — relationships.yml is checked on its own terms (see validate.py's
# rel/inferred checks): its `fields:` must cover exactly superset.py's
# REL_COLUMNS (the exported car_relationships.jsonl row), no more, no fewer.
object: rel
stream: logs-car.rel-*
dataset: car.rel

# Constants the loader stamps on every document — same shape as
# conventions.yml constants, EXCEPT there is no car.object: an edge is not a
# CAR object (it has TWO endpoints, each already naming its own object in
# car.rel.source.object / car.rel.target.object), so nothing here claims to be
# one. A consumer discriminates a rel document from an object document (or an
# inferred-node document) on event.dataset, exactly as it discriminates one
# object stream from another.
constants:
  event.kind: event
  event.module: car
  event.dataset: car.rel
  data_stream.type: logs
  data_stream.dataset: car.rel
  ecs.version: '8.11.0'

document_id:
  recipe: sha1(source_host | source_guid | relationship | target_guid | timestamp | class | identity_key)
  note: >-
    the discriminators live IN the key so a legitimately distinct edge never collides: two
    DECLARED edges between the same pair at the same instant differ only by `relationship`
    (both present in the key); a DECLARED and a DERIVED edge between the same pair differ by
    `class`; two DERIVED edges the same pair converges on by different identities differ by
    `identity_key`. A null component renders as an empty string (never dropped, so the joiner
    positions stay fixed); `|` is the joiner. `source_object` / `target_object` /
    `confidence` / `method` / `corroborated_by` are deliberately NOT in the key — they describe
    the edge, they do not distinguish it from another edge already fully identified by the
    seven components above.

fields:
  - car: timestamp
    ecs: '@timestamp'
    type: date
    also: car.rel.timestamp
    also_type: keyword
    note: >-
      the edge's own time (may differ from either endpoint's own @timestamp — e.g. a
      reconstruct edge takes the observing record's timestamp, not the missing node's). Kept
      verbatim at car.rel.timestamp (keyword) too, because the document_id recipe hashes this
      same string: an id must reproduce from the exact bytes it was minted from, not from
      whatever @timestamp's date parsing/formatting normalises it to.
  - car: source_host
    ecs: host.name
    type: keyword
    note: the evidence host — same convention as every object stream's header source_host.
  - car: relationship
    ecs: car.rel.relationship
    type: keyword
    note: >-
      the ATT&CK-vocabulary edge verb (created, loaded, accessed, executed ...; see
      model/superset/relationship-types.yml). ECS has no field for a graph-edge verb.
  - car: source_object
    ecs: car.rel.source.object
    type: keyword
    note: the CAR object name at the source end (process, file, ...). ECS has no generic edge-endpoint-type field.
  - car: source_guid
    ecs: car.rel.source.guid
    type: keyword
    note: >-
      the source endpoint's event.id — a join key back to its logs-car.<source_object>-* (or,
      when inferred_end=source, logs-car.inferred-*) row. Not aliased to ECS event.id itself:
      an edge document names TWO endpoints, and event.id is singular per ECS document.
  - car: target_object
    ecs: car.rel.target.object
    type: keyword
    note: the CAR object name at the target end. See source_object.
  - car: target_guid
    ecs: car.rel.target.guid
    type: keyword
    note: the target endpoint's event.id — a join key back to its object (or inferred) row. See source_guid.
  - car: confidence
    ecs: car.rel.confidence
    type: keyword
    note: >-
      the pipeline's confidence WORD for this edge (definitive / heuristic from the cascade,
      inferred from a reconstruct edge, or a derive.py rule's own word) — open-ended across
      DECLARED and DERIVED edges (byakugan/derive.py), unlike the object stream's
      link_confidence (a closed two-word vocabulary conventions.yml maps to a float). Kept a
      word, not coerced to a number, rather than force a vocabulary this projection cannot
      promise is closed.
  - car: method
    ecs: car.rel.method
    type: keyword
    note: >-
      how the edge was established (native_guid, pid_window, luid, image_path, or a derived-rule
      identity name) — open vocabulary across declared and derived edges; no ECS enum fits.
  - car: class
    ecs: car.rel.class
    type: keyword
    note: 'declared | derived (byakugan.superset.DECLARED/DERIVED) — the D4 relationship model''s provenance tier.'
  - car: identity_key
    ecs: car.rel.identity_key
    type: keyword
    note: >-
      the shared-identity field name a DERIVED edge converged on (a guid, a hash algorithm, a
      real SID field ...); null on a DECLARED edge. Also one of the document_id recipe's own
      discriminators.
  - car: inferred_end
    ecs: car.rel.inferred_end
    type: keyword
    note: >-
      source | target | null — which endpoint (if either) is an inferred_node rather than an
      observed row; the join hint that says to resolve that guid against logs-car.inferred-*
      instead of an object stream.
  - car: corroborated_by
    ecs: car.rel.corroborated_by
    type: keyword
    note: >-
      the guids corroborating a DERIVED edge (byakugan/superset.py _JSON_COLS: stored as JSON
      text, decoded on export) — an ECS array of keyword, not a nested object; array-valued.
