name: elastic-e2e

# The live-Elasticsearch end-to-end gate (epic #99 phase 8): dogfoods the
# shipped elastic/ deliverable itself (its own docker-compose.yml, its own
# config/setup.sh) rather than standing up ad-hoc service containers — see
# scripts/e2e_elastic.py's module docstring for the 5 steps this proves.
# Path-filtered: only runs when the stack, the engine or the gate itself
# changes; always runnable by hand via workflow_dispatch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - elastic/**
      - byakugan/**
      - scripts/e2e_elastic.py
      - .github/workflows/elastic-e2e.yml
  push:
    branches: [main]
    paths:
      - elastic/**
      - byakugan/**
      - scripts/e2e_elastic.py
      - .github/workflows/elastic-e2e.yml

jobs:
  elastic-e2e:
    runs-on: ubuntu-latest
    env:
      ELASTIC_PASSWORD: ci-elastic-superuser-pw
      KIBANA_SYSTEM_PASSWORD: ci-kibana-system-pw
      BYAKUGAN_LOADER_PASSWORD: ci-byakugan-loader-pw
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/e2e_elastic.py builds a real CarStore (byakugan.store),
          # whose carmodel.load() reads third_party/car/data_model/*.yaml —
          # the pinned CAR submodule — for every invocation, including
          # --offline-selftest. attack-datasources is not on this script's
          # own import path, but recursive matches lint.yml's own checkout
          # (both submodules are the model sources) rather than diverging.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Host prerequisite for a single-node Elasticsearch container
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Write elastic/.env (fixed CI credentials, not the .env.example placeholders)
        run: |
          cat > elastic/.env <<EOF
          ELASTIC_VERSION=9.4.3
          ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
          KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
          BYAKUGAN_LOADER_PASSWORD=${BYAKUGAN_LOADER_PASSWORD}
          ES_JAVA_OPTS=-Xms1g -Xmx1g
          EOF
      - name: Bring up the standalone Elastic stack
        run: docker compose -f elastic/docker-compose.yml up -d
      - name: Wait for Elasticsearch (authenticated) on 127.0.0.1:9201
        run: |
          set -u
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:9201/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::Elasticsearch did not answer authenticated within the timeout"
          exit 1
      - name: Wait for the setup service to exit 0 (templates identity, done by config/setup.sh)
        run: |
          set -u
          for i in $(seq 1 60); do
            cid=$(docker compose -f elastic/docker-compose.yml ps -a -q setup)
            if [ -n "$cid" ]; then
              status=$(docker inspect --format='{{.State.Status}}' "$cid")
              code=$(docker inspect --format='{{.State.ExitCode}}' "$cid")
              echo "attempt $i: setup status=$status exit_code=$code"
              if [ "$status" = "exited" ]; then
                [ "$code" = "0" ] && exit 0
                echo "::error::the setup service exited with code $code"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "::error::the setup service did not complete within the timeout"
          exit 1
      - name: Wait for Kibana's /api/status on 127.0.0.1:5602
        run: |
          set -u
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "elastic:${ELASTIC_PASSWORD}" http://127.0.0.1:5602/api/status || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::Kibana did not answer /api/status within the timeout"
          exit 1
      - name: Run the live-Elasticsearch end-to-end gate
        run: |
          python scripts/e2e_elastic.py \
            --es-url http://127.0.0.1:9201 --kibana-url http://127.0.0.1:5602 \
            --es-user elastic --es-password "${ELASTIC_PASSWORD}" \
            --loader-user byakugan_loader --loader-password "${BYAKUGAN_LOADER_PASSWORD}" \
            --namespace e2e
      - name: Dump compose logs
        if: always()
        run: docker compose -f elastic/docker-compose.yml logs
      - name: Tear down the stack
        if: always()
        run: docker compose -f elastic/docker-compose.yml down -v
