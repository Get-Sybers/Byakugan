name: lint-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive     # model/sources/car is the model source; model/sources/forensicartifacts rides along (refresh-time only)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false              # the go module is stdlib-only — no go.sum
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' yamale yamllint
      - name: Source manifests are in sync with the maps
        run: python -m byakugan.gen_sources --check
      - name: Spindle identity registry + model/spindle snapshot are in sync with the code
        run: python -m byakugan.spindle --check
      - name: Validate source manifests against the CAR sensor schema (yamale)
        run: yamale -s byakugan/car_source_schema.yaml sources/
      - name: yamllint
        run: yamllint -c .yamllint sources/ docs/to-be-validated/
      - name: gofmt
        run: |
          unformatted=$(gofmt -l go/cmd go/internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: Go build + vet + test
        run: make -C go build test
      - name: Go engine completeness (every IR predicate is ported)
        run: ./go/bin/byakugan-parse ir-check --in go/internal/ir/ir.json
      - name: ir.json is in sync with the Go authoring tables (gen-ir)
        run: ./go/bin/byakugan-parse gen-ir --check go/internal/ir/ir.json
      - name: Tests
        # the Go binary is on disk, so the CAR map tests (tests/go_engine.py)
        # exercise the real engine here rather than skipping.
        run: pytest -q
